[package]
name = "sentinel-agent"
description = "SentinelDesk user-mode endpoint agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sentinel-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
directories = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem"] }
getrandom = "0.4.3"
plist = "1.10.3"
rpassword = "7.4.0"
sentinel-protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3.27.0"
