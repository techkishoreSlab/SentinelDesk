[workspace]
resolver = "3"
members = ["crates/protocol", "crates/agent-user", "crates/privileged-service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
