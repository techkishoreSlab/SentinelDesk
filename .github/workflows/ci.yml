name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-retries 20
    # Throwaway values for the ephemeral CI database only; not used anywhere else.
    env:
      APP_ENV: test
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123456789
      APP_DB_PASSWORD: CiOnlyAppRolePassword0123456789
      MIGRATION_DATABASE_URL: postgresql+asyncpg://sentinel:ci_only_password@localhost:5432/sentinel
      DATABASE_URL: postgresql+asyncpg://sentinel_app:CiOnlyAppRolePassword0123456789@localhost:5432/sentinel
      TEST_DATABASE_URL: postgresql+asyncpg://sentinel_app:CiOnlyAppRolePassword0123456789@localhost:5432/sentinel_test
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://sentinel:ci_only_password@localhost:5432/sentinel_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run alembic upgrade head
      - run: uv run pytest -q -m integration
      - run: uv run alembic downgrade base

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  endpoint:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: endpoint
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
